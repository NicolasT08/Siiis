[project]
name = "siiis-backend-python"
version = "0.1.0"
description = "Réplica en Python + FastAPI del backend PHP de SIIIS V3 (fase 1)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]
exclude = ["^\\.venv/"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # Starlette 1.x sugiere httpx2 para TestClient; httpx sigue funcionando (ver decisions-python.md).
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
markers = [
    "integration: pruebas contra MONGO_DB_NAME_TEST en Atlas (se saltan sin MONGO_URI)",
]
